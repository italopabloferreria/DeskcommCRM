<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>I Can't Believe CRM social preview</title>
<style>
  body{margin:0;width:1280px;height:640px;background:#080808;color:#f5f5f5;font-family:Arial,Helvetica,sans-serif;display:grid;place-items:center}
  .card{width:1120px;height:480px;border:1px solid #2b2b35;background:#111111;display:grid;grid-template-columns:340px 1fr;align-items:center;padding:56px;box-sizing:border-box}
  .mark{width:236px;height:236px;border-radius:48px;background:#080808;display:grid;place-items:center;border:1px solid #2b2b35}
  .bang{font-size:72px;font-weight:800;letter-spacing:0;color:#f5f5f5}.lime{width:72px;height:14px;border-radius:99px;background:#b6ff4d;margin-top:12px}.copy h1{font-size:72px;line-height:0.95;margin:0 0 28px}.copy p{font-size:30px;color:#c7d2fe;line-height:1.25;margin:0}.accent{color:#60a5fa}
</style>
</head>
<body><main class="card"><section class="mark" aria-label="!AI"><div><div class="bang">!AI</div><div class="lime"></div></div></section><section class="copy"><h1>I Can't Believe <span class="accent">CRM</span></h1><p>CRM self-hosted da !AI para atendimento, vendas, WhatsApp e agentes de IA.</p></section></main></body>
</html>
