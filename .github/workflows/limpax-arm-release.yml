name: Publicar imagens ARM LimpaxCRM
# Publishes only this fork's artifacts after quality/build/runtime probes pass.
# No Supabase secrets, registry stable/latest tags, VPS or deployment access.
on:
  workflow_dispatch: {}
  push:
    branches: ["vertical/limpax"]
    paths:
      - ".github/workflows/limpax-arm-release.yml"
      - "scripts/publish-limpax-arm-images.mjs"
      - "tests/unit/limpax-arm-publication.test.mjs"
      - "app/app/documents/**"
      - "app/api/v1/documents/**"
      - "lib/documentos/**"
      - "scripts/prepare-document-ocr.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
permissions: {}
jobs:
  runtime:
    if: github.repository == 'italopabloferreria/DeskcommCRM'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5
      - name: Testes de recusas, mapa e permissões
        run: pnpm exec vitest run tests/unit/limpax-arm-runtime.test.mjs tests/unit/limpax-arm-publication.test.mjs tests/unit/limpax-arm-images.test.ts tests/unit/mapas-de-arquitetura.test.ts tests/unit/workflows-tem-permissions.test.ts lib/crm-b2b/spreadsheet.test.ts lib/crm-b2b/import-preview.test.ts lib/crm-b2b/import-process.test.ts app/api/v1/imports/route.test.ts app/api/v1/imports/export/route.test.ts --maxWorkers=1
        env:
          NODE_OPTIONS: --max-old-space-size=1024
      - name: Conferir lint e fragmento
        run: |
          set -euo pipefail
          pnpm exec eslint scripts/limpax-arm-runtime.mjs tests/unit/limpax-arm-runtime.test.mjs tests/infrastructure/limpax-arm-runtime-config.mjs scripts/publish-limpax-arm-images.mjs tests/unit/limpax-arm-publication.test.mjs tests/unit/workflows-tem-permissions.test.ts lib/crm-b2b/spreadsheet.ts lib/crm-b2b/spreadsheet.test.ts
          pnpm release:conferir
      - name: Validar documentos e distribuição local do OCR
        run: |
          set -euo pipefail
          pnpm exec vitest run lib/documentos/previa.test.ts lib/documentos/modelos.test.ts lib/documentos/acervo.test.ts app/app/documents/_client.test.tsx app/api/v1/documents/preview/route.test.ts app/api/v1/documents/models/route.test.ts --maxWorkers=1
          pnpm exec eslint lib/documentos app/app/documents app/api/v1/documents scripts/prepare-document-ocr.mjs scripts/smoke-document-ocr.mjs scripts/validate-document-storage.ts
          node scripts/prepare-document-ocr.mjs
          test -s public/document-ocr/por.traineddata.gz
          test -s public/document-ocr/worker.min.js
          test -s public/document-ocr/pdf.worker.min.mjs
        env:
          NODE_OPTIONS: --max-old-space-size=1024
      - name: Provar plano com Compose real e configurações fictícias
        run: node tests/infrastructure/limpax-arm-runtime-config.mjs
      - name: Verificar o kit de instalação existente
        run: |
          set -euo pipefail
          node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).scripts['test:shell']" | bash
  publicar:
    needs: runtime
    if: github.repository == 'italopabloferreria/DeskcommCRM' && github.ref == 'refs/heads/vertical/limpax'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      # Writes only the three owned images; no production credentials or deployments.
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Validar arquitetura e sondas
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          node scripts/verify-limpax-arm-images.mjs --check
      - uses: docker/setup-buildx-action@v4
      - name: Construir app ARM
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: deskcomm-smoke:pr
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=limpax-app-arm64
          cache-to: type=gha,mode=max,scope=limpax-app-arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Construir worker ARM
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.worker
          platforms: linux/arm64
          push: false
          load: true
          tags: deskcomm-worker:pr
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=limpax-worker-arm64
          cache-to: type=gha,mode=max,scope=limpax-worker-arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Construir scheduler ARM
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.scheduler
          platforms: linux/arm64
          push: false
          load: true
          tags: deskcomm-scheduler:pr
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=limpax-scheduler-arm64
          cache-to: type=gha,mode=max,scope=limpax-scheduler-arm64
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Conferir arquitetura das imagens
        run: |
          set -euo pipefail
          for image in deskcomm-smoke:pr deskcomm-worker:pr deskcomm-scheduler:pr; do
            test "$(docker inspect --format '{{.Architecture}}' "$image")" = arm64
          done
      - name: Executar sondas reais nas imagens ARM
        run: node scripts/verify-limpax-arm-images.mjs
      - name: Entrar no registro das imagens
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar exatamente as imagens testadas e gerar manifesto
        run: |
          set -euo pipefail
          node scripts/publish-limpax-arm-images.mjs
          node scripts/limpax-arm-runtime.mjs --check-manifest limpax-arm-manifest.json
          printf '%s\n' 'Imagens próprias publicadas por digest. Não houve deploy ou alteração do banco.' >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Manifesto:' '~~~json' >> "$GITHUB_STEP_SUMMARY"
          cat limpax-arm-manifest.json >> "$GITHUB_STEP_SUMMARY"
          printf '\n%s\n' '~~~' 'Acesso anônimo aos pacotes ainda precisa ser conferido; pacote novo pode nascer privado.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preservar manifesto de instalação
        uses: actions/upload-artifact@v4
        with:
          name: limpax-arm-manifest-${{ github.sha }}
          path: limpax-arm-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Encerrar containers de teste
        if: always()
        run: docker rm -f smoke worker-laco worker-boot sched 2>/dev/null || true
