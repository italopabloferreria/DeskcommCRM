name: Validar rascunho histórico LimpaxCRM
on:
  workflow_dispatch: {}
  push:
    branches: ["vertical/limpax"]
    paths:
      - ".github/workflows/limpax-historico-db.yml"
      - "supabase/drafts/**"
      - "tests/invariants/limpax-history-*-draft.test.ts"
permissions:
  contents: read
jobs:
  banco-descartavel:
    # Standard hosted runner only for the public fork; no paid private execution.
    if: github.repository == 'italopabloferreria/DeskcommCRM' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pg: ["15", "17"]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5
      - name: Buscar tags do kit publicado no upstream
        run: git fetch --no-tags --depth=1 https://github.com/melgarafael/DeskcommCRM.git refs/tags/v1.69.0:refs/tags/v1.69.0 refs/tags/v1.63.0:refs/tags/v1.63.0
      - name: Provar isolamento, rollback, replay e concorrência em DB efêmero
        env:
          CONFERENCIA_KIT_RELEASE: v1.69.0
          TEST_DB_IMAGE: pgvector/pgvector:pg${{ matrix.pg }}
          GH_TOKEN: ${{ github.token }}
        run: pnpm test:db tests/invariants/limpax-history-storage-draft.test.ts tests/invariants/limpax-history-atomic-draft.test.ts tests/invariants/limpax-history-lifecycle-draft.test.ts tests/invariants/limpax-history-management-draft.test.ts tests/invariants/limpax-history-guards-draft.test.ts
# Public fork only; no operational credentials, migrations, real imports, image publication or deploy.

      - name: Contratos de API, interface, exportação e mapa vivo
        run: pnpm vitest run tests/unit/limpax-history-management.test.ts tests/unit/limpax-customer-history-api.test.ts tests/unit/limpax-customer-history-ui.test.tsx tests/unit/limpax-history-export.test.ts tests/unit/limpax-history-export-collector.test.ts tests/unit/limpax-history-export-pdf.test.ts tests/unit/mapas-de-arquitetura.test.ts tests/unit/navegacao-completude.test.ts --maxWorkers=2

  qualidade:
    if: github.repository == 'italopabloferreria/DeskcommCRM' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/preparar-node
        timeout-minutes: 5
      - name: Governança de tipos, lint e toda a suíte unitária
        run: pnpm gov:verify
